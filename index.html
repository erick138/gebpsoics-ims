  }
  function exportRows(){
    let list;
    if(ex.scope==='learner')list=db.students.filter(s=>s.id===ex.studentId);
    else if(ex.scope==='grade')list=db.students.filter(s=>{const e=learnerEnr(s.id);return e&&String(e.grade)===String(ex.grade)});
    else list=db.students;
    return flatRows(list.slice().sort(byName),ex.cur);
  }
  const draw=()=>st.tab==='records'?recordsPane():st.tab==='import'?importPane():exportPane();
  draw();
  async function doExport(rows,label,fileBase,fmt){
    const json=fmt==='json';
    if(await saveFile(fileBase+(json?'.json':'.csv'),json?flatToJson(rows):'﻿'+flatToCsv(rows),json?'application/json':'text/csv','SF10 '+label))
      commit('Exported SF10 ('+label+', '+rows.length+' rows)','Export','SF10 Import/Export');
  }
  view.onclick=async e=>{
    const tab=e.target.closest('[data-tab]');
    if(tab){st.tab=tab.dataset.tab;view.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===tab));draw();return}
    const pick=e.target.closest('[data-pick]');if(pick){st.studentId=pick.dataset.pick;recordsPane();return}
    const del=e.target.closest('[data-del]');
    if(del){
      const [sy,gr]=del.dataset.del.split('|'),s=S[st.studentId];
      confirmBox('Remove imported record?',`Grade ${gr} (SY ${sy}) for ${s.first} ${s.last} will be removed from the SF10.`,'Remove',()=>{
        db.sf10=db.sf10.filter(r=>!(r.studentId===st.studentId&&r.sy===sy&&String(r.grade)===gr));
        commit(`Removed imported SF10 record: ${s.first} ${s.last}, Grade ${gr}, SY ${sy}`,'Delete','SF10 Import/Export');recordsPane();toast('Record removed');
      });return;
    }
    const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,s=S[st.studentId];
    if(a==='pick'){$('#pdfin',view).click();return}
    if(a==='pdf-dl'){downloadPdf(b.dataset.id);return}
    if(a==='pdf-rm'){
      const f=(db.sf10Files||[]).find(x=>x.id===b.dataset.id);if(!f)return;
      confirmBox('Remove PDF copy?',`"${f.label}" (${f.name}) will be deleted from this browser.`,'Remove',async()=>{
        db.sf10Files=db.sf10Files.filter(x=>x.id!==f.id);try{await IDB.del(f.id)}catch(err){}
        commit('Removed SF10 PDF copy of '+fullName(s)+' ('+f.name+')','Delete','SF10 Import/Export');recordsPane();toast('PDF removed');
      });return;
    }
    if(a==='one-csv'||a==='one-json'){const rows=flatRows([s]);return doExport(rows,fullName(s),'SF10_'+slug(s.last+'-'+s.first)+'_'+todayISO(),a==='one-json'?'json':'csv')}
    if(a==='one-html'){if(await saveFile('SF10_'+slug(s.last+'-'+s.first)+'_'+todayISO()+'.html',docHtml(sf10Doc(s.id)),'text/html','SF10'))commit('Exported SF10 printable form for '+fullName(s),'Export','SF10 Import/Export');return}
    if(a==='tpl'){
      const f=db.students[0],ex1=f?f.lrn:'123456789012';
      const rows=[['LRN','School Year','Grade Level','Section','School','School ID','Learning Area','Q1','Q2','Q3','Final'],[ex1,'2024-2025','6','Mabini','Sample Elementary School','123456','Mathematics','85','86','88','86'],[ex1,'2024-2025','6','Mabini','Sample Elementary School','123456','English','90','89','91','90']];
      await saveFile('sf10-import-template.csv',toCSV(rows),'text/csv','template');return;
    }
    if(a==='check'){imp.text=$('#imptext',pane).value;imp.res=sf10Validate(imp.text);importPane();return}
    if(a==='doimport'){
      const r=imp.res;if(!r||!r.ok)return;
      const blocks=new Set(r.ok.map(x=>x.studentId+'|'+x.sy+'|'+x.grade));
      db.sf10=(db.sf10||[]).filter(x=>!blocks.has(x.studentId+'|'+x.sy+'|'+x.grade)).concat(r.ok.map(x=>Object.assign({id:uid('h')},x)));
      commit(`Imported ${r.ok.length} SF10 rows for ${r.learners} learner${r.learners===1?'':'s'}`,'Import','SF10 Import/Export');
      toast(`Imported ${r.ok.length} rows`);imp.text='';imp.res=null;st.tab='records';
      view.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='records'));draw();return;
    }
    if(a==='x-save'||a==='x-copy'){
      const rows=exportRows();if(!rows.length)return toast('There are no records to export.','err');
      const label=ex.scope==='learner'?fullName(S[ex.studentId]):ex.scope==='grade'?'Grade '+ex.grade:'all learners';
      if(a==='x-copy')return copyText(ex.fmt==='json'?flatToJson(rows):flatToCsv(rows),'SF10 data');
      return doExport(rows,label,'SF10_'+slug(label)+'_'+todayISO(),ex.fmt);
    }
  };
  view.oninput=e=>{
    if(e.target.id==='rq'){st.q=e.target.value;const q=st.q.toLowerCase(),l=sorted().filter(s=>!q||(s.lrn+' '+fullName(s)).toLowerCase().includes(q)).slice(0,50);$('#picks',pane).innerHTML=l.length?l.map(s=>`<button data-pick="${s.id}" class="${s.id===st.studentId?'on':''}"><b>${esc(fullName(s))}</b><small>LRN ${esc(s.lrn)} · ${sf10Years(s.id).length} year(s) on record</small></button>`).join(''):emptyHtml('No match')}
    else if(e.target.id==='imptext')imp.text=e.target.value;

  view.onchange=e=>{

      rd.onerror=()=>toast('That file could not be read.','err');

    }
    const k=t.dataset.x;if(!k)return;
    if(k==='cur')ex.cur=t.checked;else ex[k]=t.value;
    exportPane();
  };
};

/* ---------- Subject-teacher scope ---------- */
function defaultAssignments(t){
  const out=[],mk=(g,sub)=>out.push({id:uid('as'),grade:g,section:'all',subject:sub});
  if(JHS.includes(t.dept))[7,8,9,10].forEach(g=>mk(g,t.dept));
  else if(t.dept==='Senior High')[11,12].forEach(g=>{mk(g,'Oral Communication');mk(g,'Empowerment Technologies')});
  return out;
}
function teacherScope(){
  const u=getUser();if(!u||u.role!=='Teacher')return null;
  const t=db.teachers.find(x=>x.id===u.teacherId)||null;
  return {teacher:t,list:t&&Array.isArray(t.assignments)?t.assignments.filter(a=>subjectsFor(a.grade).includes(a.subject)):[]};
}
const scopeGrades=sc=>[...new Set(sc.list.map(a=>Number(a.grade)))].sort((a,b)=>a-b);
function scopeSections(sc,g){
  const all=sectionsFor(g),m=sc.list.filter(a=>Number(a.grade)===Number(g));
  return m.some(a=>a.section==='all')?all:all.filter(s=>m.some(a=>a.section===s));
}
const scopeSubjects=(sc,g,sec)=>[...new Set(sc.list.filter(a=>Number(a.grade)===Number(g)&&(a.section==='all'||a.section===sec)).map(a=>a.subject))];
const canGrade=(sc,g,sec,sub)=>scopeSubjects(sc,g,sec).includes(sub);
const gradeOptsList=(list,sel)=>list.map(g=>`<option value="${g}"${String(g)===String(sel)?' selected':''}>Grade ${g}</option>`).join('');
const sectionsAny=g=>[...new Set(db.enrollments.filter(e=>e.sy===SY&&e.grade===Number(g)).map(e=>e.section))].sort();
function assignText(t){
  const by={};

/* ---------- Google Sheets integration ---------- */
const toTSV=rows=>rows.map(r=>r.map(c=>String(c==null?'':c).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
function sheetCsvUrl(url){
  const u=String(url||'').trim(),gid=/[#&?]gid=(\d+)/.exec(u);
  const pub=/docs\.google\.com\/spreadsheets\/d\/e\/([\w-]+)/.exec(u);
  if(pub)return 'https://docs.google.com/spreadsheets/d/e/'+pub[1]+'/pub?output=csv'+(gid?'&gid='+gid[1]:'');
  const d=/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/.exec(u);
  if(d)return 'https://docs.google.com/spreadsheets/d/'+d[1]+'/export?format=csv'+(gid?'&gid='+gid[1]:'');
  return null;
}
async function fetchSheet(url){
  const u=sheetCsvUrl(url);
  if(!u)throw new Error('That is not a Google Sheets link. Copy the address from your browser while the sheet is open.');
  let res;
  try{res=await fetch(u,{credentials:'omit'})}
  catch(e){throw new Error('The browser did not allow the download. This view cannot reach Google. Copy the cells in Google Sheets and paste them below, or open the downloaded portal file and try again.')}
  if(!res.ok)throw new Error('Google returned an error ('+res.status+'). Share the sheet with "Anyone with the link" as Viewer, or publish it to the web.');
  return res.text();
}
function parseGradeSheet(text,rows){
  const t=(text||'').trim();
  if(!t)return {fatal:'Paste the cells or fetch the sheet first.'};
  if(t[0]==='<')return {fatal:'That looks like a web page, not sheet data. The sheet may not be shared. Share it with "Anyone with the link" or paste the cells instead.'};
  const delim=t.split(/\r?\n/)[0].includes('\t')?'\t':',';
  const tbl=parseCSV(t,delim);
  if(tbl.length<2)return {fatal:'The sheet needs a header row and at least one learner row.'};
  const hdr=tbl[0].map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,''));
  const ci=(...n)=>{for(const k of n){const i=hdr.indexOf(k);if(i>=0)return i}return -1};
  const c={lrn:ci('lrn'),q:[ci('q1','1stquarter','firstquarter'),ci('q2','2ndquarter','secondquarter'),ci('q3','3rdquarter','thirdquarter')]};
  if(c.lrn<0)return {fatal:'The sheet needs an LRN column in the header row.'};
  if(c.q.every(i=>i<0))return {fatal:'The sheet needs at least one of the columns Q1, Q2, Q3.'};
  const S=sMap(),byLrn=new Map(rows.map(e=>[S[e.studentId].lrn,e]));
  const num=v=>{const s=String(v==null?'':v).trim();if(s==='')return {v:null,ok:true};if(!/^\d{2,3}$/.test(s))return {v:null,ok:false};const n=Number(s);return {v:n,ok:n>=60&&n<=100}};
  const changes=[],seen=new Set();
  tbl.slice(1).forEach((r,i)=>{
    const line=i+2,lrn=String(r[c.lrn]||'').trim(),e=byLrn.get(lrn);
    if(!lrn)return;
    if(!e){changes.push({line,name:lrn,status:'error',msg:'LRN is not in this class'});return}
    if(seen.has(lrn)){changes.push({line,name:fullName(S[e.studentId]),status:'error',msg:'Duplicate row for this learner'});return}
    seen.add(lrn);
    const vals=c.q.map(ix=>ix<0?{v:null,ok:true}:num(r[ix]));
    if(vals.some(x=>!x.ok)){changes.push({line,name:fullName(S[e.studentId]),status:'error',msg:'Grades must be whole numbers from 60 to 100'});return}
    const old=getG(e.id,ctxSubject).slice(0,3),next=vals.map(x=>x.v);
    const changed=next.some((v,k)=>v!=null&&v!==old[k]);
    changes.push({line,e,name:fullName(S[e.studentId]),old,next,status:changed?'changed':'same'});
  });
  return {changes,changed:changes.filter(x=>x.status==='changed').length,same:changes.filter(x=>x.status==='same').length,errors:changes.filter(x=>x.status==='error').length,missing:rows.filter(e=>!seen.has(S[e.studentId].lrn)).length};
}

let xlsxP=null;
function loadXlsx(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(xlsxP)return xlsxP;
  xlsxP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('x'));
    s.onerror=()=>rej(new Error('x'));
    document.head.appendChild(s);
  }).catch(()=>{xlsxP=null;throw new Error('The Excel reader could not be loaded. It needs an internet connection. Save the sheet as CSV, or paste the cells, instead.')});
  return xlsxP;
}
async function xlsxToText(buf){
  const X=await loadXlsx(),wb=X.read(new Uint8Array(buf),{type:'array'});
  for(const n of wb.SheetNames){const csv=X.utils.sheet_to_csv(wb.Sheets[n]);if(/\blrn\b/i.test(csv.split('\n').slice(0,10).join('\n')))return csv}
  return X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
}
async function makeXlsx(head,rows,name){
  const X=await loadXlsx(),ws=X.utils.aoa_to_sheet([head].concat(rows));
  ws['!cols']=head.map((h,i)=>({wch:i===0?15:i===1?30:10}));
  const wb=X.utils.book_new();
  X.utils.book_append_sheet(wb,ws,String(name).replace(/[\\\/?*\[\]:]/g,' ').slice(0,31));
  return X.write(wb,{bookType:'xlsx',type:'array'});
}

const PDF_MAX=10*1024*1024;
const IDB={
  open(){return new Promise((res,rej)=>{

  async run(mode,fn){
    const d=await this.open();
    return new Promise((res,rej)=>{
      const t=d.transaction('pdf',mode),st=t.objectStore('pdf');let out;
      try{out=fn(st)}catch(e){rej(e);return}
      t.oncomplete=()=>{d.close();res(out&&'result' in out?out.result:undefined)};
      t.onerror=()=>{d.close();rej(t.error)};t.onabort=()=>{d.close();rej(t.error||new Error('abort'))};
    });
  },
  put(k,v){return this.run('readwrite',s=>s.put(v,k))},
  get(k){return this.run('readonly',s=>s.get(k))},
  del(k){return this.run('readwrite',s=>s.delete(k))}
};
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
async function purgeFiles(studentId){
  const all=db.sf10Files||[],gone=all.filter(f=>!studentId||f.studentId===studentId);
  db.sf10Files=all.filter(f=>!gone.includes(f));
  for(const f of gone){try{await IDB.del(f.id)}catch(e){}}
}
function filesHtml(studentId){
  const list=(db.sf10Files||[]).filter(f=>f.studentId===studentId).sort((a,b)=>b.t-a.t);
  return `<section class="card flush" style="margin-bottom:12px"><div class="rhead"><div><h3>Uploaded SF10 copies</h3><small>PDF files up to 10 MB. Kept in this browser only.</small></div><div><button class="btn primary sm" data-act="pick">${ICON.plus} Upload PDF</button><input type="file" id="pdfin" accept=".pdf,application/pdf" hidden></div></div>
  ${list.length?tableHtml([{t:'Description'},{t:'Source'},{t:'File'},{t:'Uploaded'},{t:''}],list.map(f=>`<tr><td><b>${esc(f.label)}</b></td><td>${esc(f.source)}</td><td>${esc(f.name)}<small>${fmtSize(f.size)}</small></td><td>${esc(fmtDate(f.t))}<small>${esc(f.by)}</small></td><td class="acts"><button class="btn sm" data-act="pdf-dl" data-id="${f.id}">Download</button><button class="btn sm danger" data-act="pdf-rm" data-id="${f.id}">Remove</button></td></tr>`)):emptyHtml('No PDF copies uploaded','Upload a scanned SF10 or one received from a previous school.')}</section>`;
}
async function startPdfUpload(input,studentId,onDone){
  const f=input.files&&input.files[0];input.value='';
  if(!f)return;
  const s=sMap()[studentId];if(!s)return;
  if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf')return toast('Choose a PDF file.','err');
  if(f.size>PDF_MAX)return toast('That file is '+fmtSize(f.size)+'. The limit is 10 MB.','err');
  if(f.size<8)return toast('That file is empty.','err');
  const buf=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(f)}).catch(()=>null);
  if(!buf)return toast('That file could not be read.','err');
  const head=String.fromCharCode.apply(null,new Uint8Array(buf.slice(0,5)));
  if(head!=='%PDF-')return toast('That file is not a valid PDF.','err');
  openForm({title:'Upload SF10 copy for '+s.first+' '+s.last,
    fields:[{key:'label',label:'Description',required:true,full:true,hint:f.name},{key:'source',label:'Source',type:'select',full:true,options:['Previous school','Scanned original','Issued by this school','Other']}],
    values:{label:'SF10 copy',source:'Previous school'},
    async onSave(v){
      const id=uid('f');
      try{await IDB.put(id,buf)}
      catch(e){return 'The file could not be stored. This browser may be blocking or has run out of storage.'}
      const u=getUser();
      (db.sf10Files=db.sf10Files||[]).push({id,studentId,label:v.label,source:v.source,name:f.name,size:f.size,t:Date.now(),by:u?u.name:''});
      commit('Imported SF10 PDF copy for '+fullName(s)+' ('+f.name+')','Import','SF10 Import/Export');
      toast('PDF uploaded');onDone();
    }});
}
async function downloadPdf(id){
  const meta=(db.sf10Files||[]).find(f=>f.id===id);if(!meta)return;
  let buf;try{buf=await IDB.get(id)}catch(e){buf=null}
  if(!buf)return toast('The stored file could not be found in this browser.','err');
  const s=sMap()[meta.studentId];
  if(await saveFile(meta.name.replace(/[^\w.\- ]+/g,'_'),buf,'application/pdf',meta.name))commit('Exported SF10 PDF copy of '+(s?fullName(s):'a learner')+' ('+meta.name+')','Export','SF10 Import/Export');
}

/* ---------- boot ---------- */
async function migrate(){
  if(!db.messages)db.messages=[];
  if(!db.sf10Files)db.sf10Files=[];
  if(db.teachers.some(t=>!Array.isArray(t.assignments))){db.teachers.forEach(t=>{if(!Array.isArray(t.assignments))t.assignments=(db.meta&&db.meta.sample)?defaultAssignments(t):[]});persist()}
  if(!db.sf10){db.sf10=(db.meta&&db.meta.sample&&db.students.length)?makeHistory():[];persist()}
  if(!db.audit){db.audit=db.log.map(l=>({id:uid('a'),t:l.t,userId:'',who:l.who,role:'',action:inferAction(l.msg),module:'—',detail:l.msg}));persist()}
  if(db.meta&&!db.meta.threeQuarters){db.meta.threeQuarters=true;Object.values(db.grades||{}).forEach(o=>Object.keys(o).forEach(s=>{if(o[s].length>3)o[s]=o[s].slice(0,3)}));persist()}
  if(db.meta&&db.meta.sample&&!db.meta.familySeeded){
    db.meta.familySeeded=true;
    if(db.students.length&&!db.users.some(u=>FAMILY.includes(u.role))){
      const extra=(await seedUsers(db.students)).filter(u=>FAMILY.includes(u.role));
      db.users.push(...extra);
      const tu=db.users.find(u=>u.role==='Teacher'&&u.username==='teacher'&&!u.teacherId);
      if(tu&&db.teachers.some(t=>t.id==='t1'))tu.teacherId='t1';
      if(!db.messages.length)addSampleThread();
    }
    persist();
  }
}
async function init(){
  try{const t=localStorage.getItem(THEME_KEY);if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
  try{localStorage.setItem('gebpsoics.t','1');localStorage.removeItem('gebpsoics.t')}catch(e){storageOk=false}
  const stored=load();
  if(stored&&stored.v===1){db=stored}
  else{db=Object.assign({v:1,meta:{sample:true,familySeeded:true},users:[],log:[],messages:[],audit:[],sf10:[]},seed());db.sf10=makeHistory();db.users=await seedUsers(db.students);addSampleThread();persist()}
  await migrate();
  try{session=sessionStorage.getItem(SKEY)}catch(e){}
  if(!getUser())session=null;
  render();
}
init();
})();
</script>

<title>GEBPSOICS Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: top bar + left module rail + working area. Dense tables, one royal blue brand colour. */
:root{
  --bg:#f1f4fa;--surface:#ffffff;--surface-2:#f5f7fc;--ink:#13203a;--muted:#59688a;--line:#dae1ef;
  --brand:#1d4ed8;--brand-ink:#ffffff;--brand-soft:#e4ebfd;--accent:#c98300;
  --good:#17713f;--good-soft:#e0f2e8;--warn:#8f5700;--warn-soft:#fbefd5;--bad:#b3261e;--bad-soft:#fbe4e2;
  --overlay:rgba(12,22,30,.55);
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220;--surface:#131b2d;--surface-2:#182239;--ink:#e6ecf8;--muted:#93a1bd;--line:#26314b;
  --brand:#7ba3ff;--brand-ink:#0a1a40;--brand-soft:#172750;--accent:#f0b429;
  --good:#5fd19a;--good-soft:#123424;--warn:#f2b84b;--warn-soft:#3a2c0e;--bad:#ff8f86;--bad-soft:#3d1a18;
  --overlay:rgba(0,0,0,.65);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220;--surface:#131b2d;--surface-2:#182239;--ink:#e6ecf8;--muted:#93a1bd;--line:#26314b;
  --brand:#7ba3ff;--brand-ink:#0a1a40;--brand-soft:#172750;--accent:#f0b429;
  --good:#5fd19a;--good-soft:#123424;--warn:#f2b84b;--warn-soft:#3a2c0e;--bad:#ff8f86;--bad-soft:#3d1a18;
  --overlay:rgba(0,0,0,.65);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.2}h2{font-size:18px}h3{font-size:15px}
p{margin:0}
small{color:var(--muted);font-size:12px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}

.shell{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{max-width:1280px;margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--font-head);font-size:18px;letter-spacing:.02em;display:block;line-height:1.1}
.brand small{display:block}
.emblem{width:34px;height:34px;flex:none}
.brand.big .emblem{width:44px;height:44px}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;line-height:1.2}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px}
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:208px minmax(0,1fr);gap:20px;align-items:start}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.side a:hover{background:var(--surface);color:var(--ink)}
.side a.on{background:var(--brand);color:var(--brand-ink)}
#view{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px;gap:6px}
  .side a{white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
  .side a.on{border-color:var(--brand)}
}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card>h2,.card>h3{margin-bottom:10px}
.card.flush{padding:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.btn{font:inherit;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.block{width:100%}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;height:36px;padding:0 10px;min-width:0;max-width:100%}
input[type=checkbox]{height:auto;width:auto}
input::placeholder{color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right}
td.low{color:var(--bad);font-weight:700}
td.acts{white-space:nowrap;text-align:right}
td.acts .btn+.btn{margin-left:4px}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
td small{display:block}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);color:var(--muted);flex-wrap:wrap}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:2px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.tile span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile b{display:block;font-family:var(--font-head);font-size:30px;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.tile small{display:block;margin-top:2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:70px minmax(0,1fr) 96px;gap:10px;align-items:center}
.barrow .lbl{font-weight:600}
.track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:var(--brand);border-radius:6px}
.fill.alt{background:var(--accent)}
.barrow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.barrow .val small{font-weight:400}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.feed li:last-child{border-bottom:0}
.feed time{color:var(--muted);font-size:12px;white-space:nowrap}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:var(--radius);padding:10px 14px}
.banner p{flex:1}
.quick{display:flex;gap:8px;flex-wrap:wrap}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:0}
.tabs button{font:inherit;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.split{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:899px){.split{grid-template-columns:minmax(0,1fr)}}
.picklist{display:flex;flex-direction:column;max-height:420px;overflow-y:auto}
.picklist button{font:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer;color:var(--ink)}
.picklist button:hover{background:var(--surface-2)}
.picklist button.on{background:var(--brand-soft)}
.picklist small{display:block}
.rc-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px;border-bottom:1px solid var(--line)}
.rc-head dl{margin:0;display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:13px}
.rc-head dt{color:var(--muted)}
.rc-head dd{margin:0;font-weight:600}
.rc-sum{display:flex;gap:24px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line)}
.rc-sum div b{display:block;font-family:var(--font-head);font-size:22px}
.grade-in{width:64px;text-align:center;font-variant-numeric:tabular-nums;padding:0 4px}
.grade-in.bad{border-color:var(--bad);background:var(--bad-soft)}
.dirty{color:var(--warn);font-weight:600}
.reports{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:899px){.reports{grid-template-columns:minmax(0,1fr)}}
.rlist{display:flex;flex-direction:column;gap:6px}
.rlist button{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;cursor:pointer;color:var(--ink)}
.rlist button.on{border-color:var(--brand);background:var(--brand-soft)}
.rlist b{display:block}
.rlist small{display:block}
.params{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px;border-bottom:1px solid var(--line)}
.params label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.params .grow{margin-left:auto}
.rhead{padding:12px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}

.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:480px;margin:auto}
.modal.wide{max-width:640px}
.modal h2{margin-bottom:12px}
.modal p.msg{color:var(--muted);margin-bottom:4px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12.5px;font-weight:600}
.fld>span b{color:var(--bad)}
.fld.full{grid-column:1/-1}
.fld input,.fld select{width:100%}
.ferr{color:var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:8px;margin-top:12px;font-weight:500}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;padding:24px}
.login-card .hint{color:var(--muted);font-size:12.5px;text-align:center}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:80;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.err{background:var(--bad);color:#fff}
.note{max-width:1280px;margin:16px auto 0;color:var(--muted);font-size:12.5px}
textarea.csv{width:100%;height:180px;padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;resize:vertical;min-height:84px}
.badge{margin-left:auto;background:var(--accent);color:#1b1300;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.thread{display:flex;flex-direction:column;gap:12px;padding:16px;max-height:420px;overflow-y:auto}
.msg{max-width:min(560px,92%);align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.msg.me{align-self:flex-end;background:var(--brand-soft);border-color:transparent}
.msg .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.msg .mh time{color:var(--muted);font-size:12px;margin-left:auto}
.reply{border-top:1px solid var(--line);padding:12px}
.kv{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:8px 12px;margin:0 0 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.banner p{margin:0}
button,.btn,.side a,[role=tab]{cursor:pointer}
button:disabled,.btn:disabled{cursor:not-allowed}
.btn,.tabs button,.rlist button,.picklist button,.side a,.switch{transition:background-color .15s,border-color .15s,color .15s,filter .15s,transform .1s}
@media (hover:hover){
  .btn:hover:not(:disabled){background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
  .btn.primary:hover:not(:disabled){background:var(--brand);border-color:var(--brand);color:var(--brand-ink);filter:brightness(1.15)}
  .btn.danger:hover:not(:disabled){background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .btn.danger.solid:hover:not(:disabled){background:var(--bad);border-color:var(--bad);color:#fff;filter:brightness(1.12)}
  .tabs button:hover{color:var(--brand);background:var(--surface-2)}
  .rlist button:hover{border-color:var(--brand);background:var(--brand-soft)}
  .picklist button:hover{background:var(--brand-soft)}
  .side a:hover{background:var(--brand-soft);color:var(--brand)}
  .side a.on:hover{background:var(--brand);color:var(--brand-ink)}
  .switch:hover{border-color:var(--brand)}
}
.btn:active:not(:disabled){transform:translateY(1px)}
.switch{position:relative;width:52px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;padding:0;flex:none}
.switch .thumb{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.switch .thumb .ic{width:14px;height:14px}
.switch .moon{display:none}
.switch[aria-checked="true"] .thumb{transform:translateX(24px)}
.switch[aria-checked="true"] .sun{display:none}
.switch[aria-checked="true"] .moon{display:block}
.login-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
@media (prefers-reduced-motion:no-preference){.switch .thumb{transition:transform .18s}}

/* ---- interface polish ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1{font-size:26px}
.page-head{padding-bottom:2px}
.page-head p{font-size:13.5px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 1px 2px rgba(15,30,40,.06),0 6px 18px rgba(15,30,40,.05)}
.card,.tile{box-shadow:0 1px 2px rgba(15,30,40,.04)}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:14px 12px 4px}
.grp:first-child{padding-top:4px}
@media (min-width:900px){
  .side{top:84px;max-height:calc(100vh - 100px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;gap:2px}
  .side a{padding:9px 12px}
}
@media (max-width:899px){.grp{display:none}.topbar{padding:8px 12px}.who b,.who small{display:none}}
.tile{position:relative}
.tile .ti{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-style:normal}
.who-cell{display:flex;align-items:center;gap:10px}
.who-cell b,.who-cell small{display:block}
.ini{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.pill.good,.pill.warn,.pill.bad{display:inline-flex;align-items:center;gap:6px}
.pill.good::before,.pill.warn::before,.pill.bad::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.empty{padding:44px 16px}
.empty b{font-family:var(--font-head);font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.overlay{backdrop-filter:blur(3px)}
.modal{position:relative;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.modal h2{padding-right:32px}
.modal .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.modal .x:hover{background:var(--surface-2);color:var(--ink)}
.login{display:grid;place-items:center;min-height:100vh}
.login-wrap{width:100%;max-width:900px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:0 20px 50px rgba(15,30,40,.14)}
.login-aside{background:var(--brand);color:var(--brand-ink);padding:36px 32px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.login-aside .emblem rect{fill:var(--brand-ink)}
.login-aside .emblem path{stroke:var(--brand)}
.login-aside h2{font-size:24px;line-height:1.25}
.login-aside p{opacity:.85}
.login-aside ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.login-aside li{display:flex;gap:8px;align-items:flex-start}
.login-aside li::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-top:8px;flex:none}
.login-wrap .login-card{max-width:none;border:0;border-radius:0;box-shadow:none;padding:32px}
@media (max-width:760px){.login-wrap{grid-template-columns:minmax(0,1fr)}.login-aside{padding:20px;gap:8px}.login-aside ul,.login-aside p{display:none}.login-aside h2{font-size:18px}.login-wrap .login-card{padding:20px}}
@media (prefers-reduced-motion:no-preference){
  #view>*{animation:rise .28s ease both}
  .modal{animation:rise .2s ease both}
  .overlay{animation:fade .15s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
  @keyframes fade{from{opacity:0}}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(6px)}}}
</style>

<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const KEY='gebpsoics.portal.v1', SKEY='gebpsoics.session.v1', SY='2026-2027';

const hashPw=async pw=>{
  const s='gebpsoics:'+pw;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'x'+h.toString(16)}
};

function inferAction(m){
  if(/^Signed in/.test(m))return 'Login';
  if(/^Signed out/.test(m))return 'Logout';
  if(/^(Added|Enrolled)/.test(m))return 'Create';
  if(/^Imported/.test(m))return 'Import';

  if(/^(Deleted|Removed|Cleared)/.test(m))return 'Delete';

}

const sMap=()=>Object.fromEntries(db.students.map(s=>[s.id,s]));
const getG=(eid,sub)=>(db.grades[eid]&&db.grades[eid][sub])||[null,null,null];
const avg=a=>{const v=a.filter(x=>x!=null);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null};
const finalOf=a=>a.some(v=>v==null)?null:Math.round(a.reduce((x,y)=>x+y,0)/a.length);
const remark=f=>f==null?'Incomplete':(f>=75?'Passed':'Failed');
const descriptor=g=>g==null?'':g>=90?'Outstanding':g>=85?'Very Satisfactory':g>=80?'Satisfactory':g>=75?'Fairly Satisfactory':'Did Not Meet Expectations';
const gradeFor=(e,sub,q)=>{const a=getG(e.id,sub);return q==='final'?finalOf(a):a[Number(q)-1]};
function gaFor(e,q){const v=subjectsFor(e.grade).map(s=>gradeFor(e,s,q));return v.some(x=>x==null)?null:avg(v)}
const f2=v=>v==null?'—':(Math.round(v*100)/100).toFixed(2);
const curEnr=()=>db.enrollments.filter(e=>e.sy===SY);
function enrolledIn(grade,section){

}

function allSectionLabels(){return [...new Set(db.enrollments.filter(e=>e.sy===SY).map(e=>e.grade+'-'+e.section))].sort()}

function toast(msg,kind){

  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),kind==='err'?4200:2600);

function modal(html,opts){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="modal${opts&&opts.wide?' wide':''}" role="dialog" aria-modal="true"><button type="button" class="x" data-close aria-label="Close">&times;</button>${html}</div>`;
  document.body.appendChild(o);
  let done=false;
  const close=()=>{if(done)return;done=true;o.remove()};
  const dismiss=()=>{if(done)return;close();if(opts&&opts.onDismiss)opts.onDismiss()};
  o.addEventListener('mousedown',e=>{if(e.target===o)dismiss()});
  o.addEventListener('click',e=>{if(e.target.closest('[data-close]'))dismiss()});
  o.addEventListener('dismiss',dismiss);
  return {el:o.firstElementChild,close};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const all=document.querySelectorAll('.overlay');if(all.length)all[all.length-1].dispatchEvent(new Event('dismiss'))}});

  m.el.querySelector('#cb_no').focus();
}
function fieldHtml(f,val){
  val=val==null?'':val;const id='f_'+f.key;let ctl;
  if(f.type==='select'){
    ctl=`<select id="${id}" name="${id}">${(f.options||[]).map(o=>{const ov=typeof o==='object'?o.v:o,ol=typeof o==='object'?o.l:o;return `<option value="${esc(ov)}"${String(ov)===String(val)?' selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  }else if(f.type==='textarea'){
    ctl=`<textarea id="${id}" name="${id}" rows="${f.rows||5}">${esc(val)}</textarea>`;
  }else if(f.type==='combo'){
    ctl=`<input id="${id}" name="${id}" list="dl_${f.key}" value="${esc(val)}" autocomplete="off"><datalist id="dl_${f.key}">${(f.options||[]).map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;
  }else{
    ctl=`<input id="${id}" name="${id}" type="${f.type||'text'}" value="${esc(val)}"${f.placeholder?` placeholder="${esc(f.placeholder)}"`:''}${f.maxlength?` maxlength="${f.maxlength}"`:''}${f.type==='password'?' autocomplete="new-password"':''}>`;
  }
  return `<label class="fld${f.full?' full':''}" for="${id}"><span>${esc(f.label)}${f.required?' <b aria-hidden="true">*</b>':''}</span>${ctl}${f.hint?`<small>${esc(f.hint)}</small>`:''}</label>`;
}
function openForm(o){
  const values=o.values||{};
  const m=modal(`<form novalidate><h2>${esc(o.title)}</h2><div class="fgrid">${o.fields.map(f=>fieldHtml(f,values[f.key])).join('')}</div><p class="ferr" role="alert" hidden></p><div class="actions"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">${esc(o.submitLabel||'Save')}</button></div></form>`,{wide:o.wide});
  const form=m.el.querySelector('form'),errEl=m.el.querySelector('.ferr');
  const fail=(msg,el)=>{errEl.textContent=msg;errEl.hidden=false;if(el)el.focus();return false};
  form.addEventListener('submit',ev=>{
    ev.preventDefault();const out={};
    for(const f of o.fields){
      const el=form.elements['f_'+f.key];let v=el.value;if(f.type!=='password')v=v.trim();
      if(f.required&&!v)return fail(f.label+' is required.',el);
      out[f.key]=v;
    }
    for(const f of o.fields){if(f.validate&&(out[f.key]||f.required)){const msg=f.validate(out[f.key],out);if(msg)return fail(msg,form.elements['f_'+f.key])}}
    const res=o.onSave(out);
    if(res&&typeof res.then==='function'){res.then(msg=>{if(msg)fail(msg);else m.close()});return}
    if(res)return fail(res);
    m.close();
  });
  if(o.onReady)o.onReady(m.el);
  const first=form.querySelector('input,select');if(first)setTimeout(()=>first.focus(),0);
}
function paginate(arr,page,per){const pages=Math.max(1,Math.ceil(arr.length/per));page=Math.min(Math.max(1,page),pages);return {items:arr.slice((page-1)*per,page*per),page,pages,total:arr.length}}

const emptyHtml=(t,s)=>`<div class="empty"><b>${esc(t)}</b>${esc(s||'')}</div>`;
const tableHtml=(head,rows,foot)=>`<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th${h.num?' class="num"':''}>${h.t}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody>${foot||''}</table></div>`;
const options=(arr,sel)=>arr.map(o=>{const v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.l:o;return `<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`}).join('');
const gradeOpts=(sel,all)=>(all?`<option value="">All grades</option>`:'')+GRADES.map(g=>`<option value="${g}"${String(g)===String(sel)?' selected':''}>Grade ${g}</option>`).join('');
function copyText(text,label){
  const fallback=()=>{
    const m=modal(`<h2>Copy ${esc(label||'data')}</h2><p class="msg">Your browser blocked automatic copying. Select the text below and copy it.</p><textarea class="csv" readonly></textarea><div class="actions"><button class="btn" data-close>Close</button></div>`,{wide:true});
    const ta=m.el.querySelector('textarea');ta.value=text;ta.focus();ta.select();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard'),fallback);else fallback();
}

/* ---------- theme ---------- */
const THEME_KEY='gebpsoics.theme';
const isDark=()=>{const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)};
function themeSwitch(){
  const d=isDark();
  return `<button type="button" class="switch" id="themeToggle" role="switch" aria-checked="${d}" aria-label="Dark theme" title="${d?'Switch to light theme':'Switch to dark theme'}"><span class="thumb"><span class="sun">${ICON.sun}</span><span class="moon">${ICON.moon}</span></span></button>`;
}
function bindTheme(){
  const b=$('#themeToggle');if(!b)return;
  b.onclick=()=>{
    const next=isDark()?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem(THEME_KEY,next)}catch(e){}
    b.setAttribute('aria-checked',String(next==='dark'));
    b.title=next==='dark'?'Switch to light theme':'Switch to dark theme';
  };
}

/* ---------- shell / routing ---------- */
const MODULES={};
function loginHtml(){
  return `<div class="shell login"><div class="login-wrap"><aside class="login-aside"><div class="brand big">${EMBLEM}<div><b>GEBPSOICS</b><small style="color:inherit;opacity:.8">School Portal</small></div></div><h2>The whole school year in one place.</h2><p>One sign-in for administrators, teachers, students and parents.</p><ul><li>Grades and report cards</li><li>DepEd forms and SF10 records</li><li>Parent and adviser messages</li><li>A full audit trail</li></ul></aside><form class="card login-card" id="loginForm" novalidate>
    <div class="login-top"><div class="brand big">${EMBLEM}<div><b>GEBPSOICS</b><small>School Portal</small></div></div>${themeSwitch()}</div>
    <h1>Sign in</h1>
    <label class="fld" for="lu"><span>Username</span><input id="lu" name="lu" autocomplete="username" autocapitalize="none"></label>
    <label class="fld" for="lp"><span>Password</span><input id="lp" name="lp" type="password" autocomplete="current-password"></label>
    <label class="chk" for="showpw"><input type="checkbox" id="showpw"> Show password</label>
    <p class="ferr" id="lerr" role="alert" hidden style="margin-top:0"></p>
    <button class="btn primary block" type="submit">Sign in</button>
    ${db.meta.sample?'<p class="hint">Sample accounts (username / password):<br><code>admin</code> / <code>admin123</code> · <code>teacher</code> / <code>teacher123</code><br><code>student</code> / <code>student123</code> · <code>parent</code> / <code>parent123</code></p>':''}
  </form></div></div>`;
}
function bindLogin(){
  const f=$('#loginForm');$('#lu').focus();
  $('#showpw').onchange=e=>{$('#lp').type=e.target.checked?'text':'password'};
  f.onsubmit=async ev=>{
    ev.preventDefault();
    const un=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value,err=$('#lerr');
    const u=db.users.find(x=>x.username.toLowerCase()===un);
    const h=await hashPw(pw);
    if(!u||u.hash!==h){auditRaw({who:un||'(blank)',role:u?u.role:'',action:'Login failed',module:'Authentication',detail:u?'Wrong password':'Unknown username'});persist();err.textContent='Incorrect username or password.';err.hidden=false;return}
    if(u.status!=='Active'){auditRaw({who:u.name,role:u.role,action:'Login failed',module:'Authentication',detail:'Disabled account blocked'});persist();err.textContent='This account is disabled. Ask an administrator to enable it.';err.hidden=false;return}
    u.last=Date.now();session=u.id;try{sessionStorage.setItem(SKEY,u.id)}catch(e){}
    commit('Signed in','Login','Authentication');location.hash='dashboard';render();
  };
}
function render(){
  const root=$('#root');
  const u=getUser();
  if(!u){root.innerHTML=loginHtml();bindLogin();bindTheme();return}
  const allowed=ROUTES.filter(r=>r.roles.includes(u.role));
  const id=location.hash.slice(1);
  const r=allowed.find(x=>x.id===id)||allowed[0];
  activeRoute=r.id;
  const ini=u.name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  root.innerHTML=`<div class="shell"><header class="topbar"><div class="brand">${EMBLEM}<div><b>GEBPSOICS</b><small>School Portal · SY ${SY}</small></div></div>
    <div class="who">${themeSwitch()}<span class="avatar" aria-hidden="true">${esc(ini)}</span><div><b>${esc(u.name)}</b><small>${esc(u.role)}</small></div><button class="btn sm" id="signout">Sign out</button></div></header>
    <div class="app"><nav class="side" aria-label="Modules">${allowed.map(x=>`<a href="#${x.id}"${x.id===r.id?' class="on" aria-current="page"':''}>${ICON[x.id]}<span>${x.id==='my-grades'&&u.role==='Parent'?'Learner Grades':x.label}</span>${x.id==='messages'&&unreadCount(u)?`<span class="badge">${unreadCount(u)}</span>`:''}</a>`).join('')}</nav><main id="view" tabindex="-1"></main></div>
    ${storageOk?'':'<p class="note">This browser is not saving data. Changes will be lost when you close this page.</p>'}</div>`;
  (function(){
    const G={dashboard:'Overview',teachers:'People',students:'People',enrollment:'People',users:'People',grades:'Academics','grades-viewing':'Academics','my-grades':'Academics',messages:'Academics',reports:'Records',forms:'Records',sf10:'Records',audit:'Administration',profile:'Account'};
    let last='';
    document.querySelectorAll('.side a').forEach(a=>{const g=G[a.getAttribute('href').slice(1)];if(g&&g!==last){const d=document.createElement('div');d.className='grp';d.textContent=g;a.parentNode.insertBefore(d,a);last=g}});
  })();
  bindTheme();
  $('#signout').onclick=()=>{ui.grades.dirty=false;commit('Signed out','Logout','Authentication');session=null;try{sessionStorage.removeItem(SKEY)}catch(e){}location.hash='';render()};
  $('.side').addEventListener('click',e=>{
    const a=e.target.closest('a');
    if(a&&ui.grades.dirty&&activeRoute==='grades'){e.preventDefault();const to=a.getAttribute('href');confirmBox('Discard unsaved grades?','You have grade changes that have not been saved.','Discard',()=>{ui.grades.dirty=false;location.hash=to.slice(1)})}
  });
  MODULES[r.id]($('#view'));
}
window.addEventListener('hashchange',()=>{if(getUser())render()});

/* ---------- Dashboard ---------- */
MODULES.dashboard=function(view){
  const u=getUser(),E=curEnr(),S=sMap();
  if(FAMILY.includes(u.role))return familyHome(view);
  if(u.role==='Teacher')return teacherHome(view);
  const enrolled=E.filter(e=>e.status==='Enrolled'&&S[e.studentId]);
  const pending=E.filter(e=>e.status==='Pending').length;
  const secs=new Set(enrolled.map(e=>e.grade+'-'+e.section)).size;
  const activeT=db.teachers.filter(t=>t.status==='Active').length;
  const byG=GRADES.map(g=>{const l=enrolled.filter(e=>e.grade===g);return {g,n:l.length,m:l.filter(e=>S[e.studentId].sex==='M').length,f:l.filter(e=>S[e.studentId].sex==='F').length}});
  const maxN=Math.max(1,...byG.map(x=>x.n));
  const prog=[1,2,3].map(q=>{let tot=0,done=0;enrolled.forEach(e=>subjectsFor(e.grade).forEach(s=>{tot++;if(getG(e.id,s)[q-1]!=null)done++}));return {q,tot,done,pct:tot?Math.round(done/tot*100):0}});
  const latest=[...prog].reverse().find(p=>p.done>0);
  let atRisk=0;
  if(latest)enrolled.forEach(e=>{if(subjectsFor(e.grade).some(s=>{const v=getG(e.id,s)[latest.q-1];return v!=null&&v<75}))atRisk++});
  const can=id=>ROUTES.find(r=>r.id===id).roles.includes(u.role);
  view.innerHTML=pageHead('Dashboard',`School year ${SY} · ${new Date().toLocaleDateString('en-PH',{dateStyle:'full'})}`)+
  (db.meta.sample?`<div class="banner"><p>Sample records are loaded so you can try every module. Clear them under Users, then Data tools, before you start real encoding.</p></div>`:'')+
  `<div class="tiles">
    <div class="tile"><i class="ti">${ICON.students}</i><span>Enrolled learners</span><b>${enrolled.length}</b><small>${pending} pending approval</small></div>
    <div class="tile"><i class="ti">${ICON.enrollment}</i><span>Sections</span><b>${secs}</b><small>across ${new Set(enrolled.map(e=>e.grade)).size} grade levels</small></div>
    <div class="tile"><i class="ti">${ICON.teachers}</i><span>Active teachers</span><b>${activeT}</b><small>${db.teachers.length} on the roster</small></div>
    <div class="tile"><i class="ti">${ICON.grades}</i><span>Below 75 in a subject</span><b>${latest?atRisk:'—'}</b><small>${latest?QLABEL[latest.q]:'No grades encoded yet'}</small></div>
  </div>
  <div class="two">
    <section class="card"><h2>Enrollment by grade level</h2><div class="bars">${byG.map(x=>`<div class="barrow"><span class="lbl">Grade ${x.g}</span><div class="track"><div class="fill" style="width:${Math.round(x.n/maxN*100)}%"></div></div><span class="val">${x.n} <small>${x.m}M · ${x.f}F</small></span></div>`).join('')}</div></section>
    <section class="card"><h2>Grade encoding progress</h2><div class="bars">${prog.map(p=>`<div class="barrow"><span class="lbl">Q${p.q}</span><div class="track"><div class="fill alt" style="width:${p.pct}%"></div></div><span class="val">${p.pct}% <small>${p.done}/${p.tot}</small></span></div>`).join('')}</div><p style="margin-top:12px"><small>Share of subject grades entered for enrolled learners.</small></p></section>
  </div>
  <div class="two">
    <section class="card"><h2>Quick actions</h2><div class="quick">${can('students')?`<button class="btn primary" data-go="students" data-new="1">${ICON.plus} Add student</button>`:''}${can('enrollment')?`<button class="btn" data-go="enrollment" data-new="1">${ICON.plus} Enroll learner</button>`:''}${can('grades')?`<button class="btn" data-go="grades">Encode grades</button>`:''}${can('reports')?`<button class="btn" data-go="reports">Open reports</button>`:''}${can('messages')?`<button class="btn" data-go="messages">Messages</button>`:''}</div></section>
    <section class="card"><h2>Recent activity</h2>${db.log.length?`<ul class="feed">${db.log.slice(0,6).map(l=>`<li><span><b>${esc(l.who)}</b> · ${esc(l.msg)}</span><time>${esc(fmtDate(l.t))}</time></li>`).join('')}</ul>`:emptyHtml('No activity yet','Changes you make will be listed here.')}</section>
  </div>`;
  view.onclick=e=>{const b=e.target.closest('[data-go]');if(!b)return;if(b.dataset.new)ui.pendingNew=b.dataset.go;location.hash=b.dataset.go};
};

    {key:'empNo',label:'Employee no.',required:true,validate:v=>db.teachers.some(t=>t.empNo.toLowerCase()===v.toLowerCase()&&(!cur||t.id!==cur.id))?'That employee number is already used.':''},
    {key:'status',label:'Status',type:'select',options:['Active','On leave','Inactive']},
    {key:'last',label:'Last name',required:true},{key:'first',label:'First name',required:true},
    {key:'dept',label:'Department / subject',type:'combo',options:DEPTS,required:true},

    {key:'phone',label:'Contact no.'},

  }

  view.oninput=e=>{if(e.target.id==='tq'){st.q=e.target.value;st.page=1;list()}else if(e.target.id==='ts'){st.status=e.target.value;st.page=1;list()}};

/* ---------- Students ---------- */
function enrMapNow(){const m={};curEnr().forEach(e=>{if(!m[e.studentId]||e.status==='Enrolled')m[e.studentId]=e});return m}
MODULES.students=function(view){
  const st=ui.students;
  view.innerHTML=pageHead('Students','Learner records and personal information',`<button class="btn primary" data-act="add">${ICON.plus} Add student</button>`)+
  `<div class="card flush"><div class="toolbar"><input type="search" id="sq" placeholder="Search name, LRN or guardian" value="${esc(st.q)}" aria-label="Search students"><select id="sg" aria-label="Filter by grade">${gradeOpts(st.grade,true)}</select><select id="ss" aria-label="Filter by status"><option value="">All statuses</option>${options(['Active','Transferred','Dropped','Graduated'],st.status)}</select></div><div id="list"></div></div>`;
  const fields=cur=>[
    {key:'lrn',label:'LRN',required:true,maxlength:12,hint:'12-digit Learner Reference Number.',validate:v=>!/^\d{12}$/.test(v)?'LRN must be exactly 12 digits.':db.students.some(s=>s.lrn===v&&(!cur||s.id!==cur.id))?'That LRN already belongs to another learner.':''},
    {key:'sex',label:'Sex',type:'select',options:[{v:'F',l:'Female'},{v:'M',l:'Male'}]},
    {key:'last',label:'Last name',required:true},{key:'first',label:'First name',required:true},
    {key:'middle',label:'Middle name'},{key:'birth',label:'Date of birth',type:'date',required:true},
    {key:'guardian',label:'Parent / guardian'},{key:'phone',label:'Contact no.'},
    {key:'address',label:'Address',full:true},
    {key:'status',label:'Status',type:'select',options:['Active','Transferred','Dropped','Graduated']}
  ];
  function list(){
    const E=enrMapNow(),q=st.q.toLowerCase();
    const rows=db.students.filter(s=>{
      if(q&&!(s.lrn+' '+fullName(s)+' '+(s.guardian||'')).toLowerCase().includes(q))return false;
      if(st.status&&s.status!==st.status)return false;
      if(st.grade){const e=E[s.id];if(!e||String(e.grade)!==st.grade)return false}
      return true}).sort(byName);
    const p=paginate(rows,st.page,15);st.page=p.page;
    $('#list',view).innerHTML=p.total?tableHtml([{t:'LRN'},{t:'Learner'},{t:'Grade & section'},{t:'Guardian'},{t:'Status'},{t:''}],p.items.map(s=>{
      const e=E[s.id];
      return `<tr><td>${esc(s.lrn)}</td><td><div class="who-cell">${iniOf(fullName(s))}<div><b>${esc(fullName(s))}</b><small>${s.sex==='M'?'Male':'Female'} · ${age(s.birth)} yrs</small></div></div></td><td>${e?`Grade ${e.grade} - ${esc(e.section)}${e.status!=='Enrolled'?' '+pill(e.status):''}`:pill('Not enrolled')}</td><td>${esc(s.guardian||'—')}<small>${esc(s.phone||'')}</small></td><td>${pill(s.status)}</td><td class="acts"><button class="btn sm" data-act="grades" data-id="${s.id}"${e&&e.status==='Enrolled'?'':' disabled'}>Grades</button><button class="btn sm" data-act="edit" data-id="${s.id}">Edit</button><button class="btn sm danger" data-act="del" data-id="${s.id}">Delete</button></td></tr>`}))+pagerHtml(p):emptyHtml('No students found','Try a different search or add a student.');
  }
  list();
  const add=()=>openForm({title:'Add student',fields:fields(null),wide:true,values:{sex:'F',status:'Active'},onSave(v){db.students.push(Object.assign({id:uid('s')},v));commit('Added student '+v.first+' '+v.last);list();toast('Student added. Enroll them in the Enrollment module.')}});
  view.oninput=e=>{const id=e.target.id;if(id==='sq')st.q=e.target.value;else if(id==='sg')st.grade=e.target.value;else if(id==='ss')st.status=e.target.value;else return;st.page=1;list()};
  view.onclick=e=>{
    const b=e.target.closest('[data-act]');if(!b)return;const s=db.students.find(x=>x.id===b.dataset.id);
    ({add,prev(){st.page--;list()},next(){st.page++;list()},
      grades(){const en=enrMapNow()[s.id];ui.gv.tab='learner';ui.gv.studentId=s.id;ui.gv.grade=en.grade;location.hash='grades-viewing'},
      edit(){openForm({title:'Edit student',fields:fields(s),wide:true,values:s,onSave(v){Object.assign(s,v);commit('Updated student '+s.first+' '+s.last);list();toast('Student updated')}})},
      del(){confirmBox('Delete student?',`${s.first} ${s.last} and all of their enrollment and grade records will be permanently removed.`,'Delete',()=>{
        const ids=db.enrollments.filter(x=>x.studentId===s.id).map(x=>x.id);ids.forEach(i=>delete db.grades[i]);
        db.enrollments=db.enrollments.filter(x=>x.studentId!==s.id);db.students=db.students.filter(x=>x.id!==s.id);db.sf10=(db.sf10||[]).filter(r=>r.studentId!==s.id);purgeFiles(s.id);
        commit('Deleted student '+s.first+' '+s.last);list();toast('Student deleted')})}})[b.dataset.act]();
  };
  if(ui.pendingNew==='students'){ui.pendingNew=null;add()}
};

MODULES.enrollment=function(view){
  const st=ui.enrollment;
  const counts=()=>{const E=curEnr();return ['Enrolled','Pending','Dropped','Transferred out'].map(s=>({s,n:E.filter(e=>e.status===s).length}))};
  view.innerHTML=pageHead('Enrollment',`Enrollment records for school year ${SY}`,`<button class="btn primary" data-act="add">${ICON.plus} Enroll learner</button>`)+

  function tiles(){$('#etiles',view).innerHTML=counts().map(c=>`<div class="tile"><span>${c.s}</span><b>${c.n}</b></div>`).join('')}
  function list(){
    tiles();const S=sMap(),q=st.q.toLowerCase();

  }

MODULES.grades=function(view){
  const st=ui.grades,sc=teacherScope();
  if(sc){const gs=scopeGrades(sc);if(!gs.length)return noAssignment(view,'Grades');if(!gs.includes(Number(st.grade)))st.grade=gs[0]}
  const secs=sc?scopeSections(sc,st.grade):sectionsFor(st.grade);if(!secs.includes(st.section))st.section=secs[0]||'';
  const subs=sc?scopeSubjects(sc,st.grade,st.section):subjectsFor(st.grade);if(!subs.includes(st.subject))st.subject=subs[0];
  const rows=st.section?enrolledIn(st.grade,st.section):[],S=sMap();
  view.innerHTML=pageHead('Grades',(sc?'Showing only the subjects and classes assigned to you. ':'Encode quarterly grades by class and subject. ')+'Grades are whole numbers from 60 to 100.',`<button class="btn" data-act="gsheet"${rows.length?'':' disabled'}>Google Sheets</button><button class="btn" data-act="spoint"${rows.length?'':' disabled'}>SharePoint</button><span id="dirty" class="dirty" hidden>Unsaved changes</span><button class="btn primary" data-act="save"${rows.length?'':' disabled'}>Save grades</button>`)+
  `<div class="card flush"><div class="toolbar"><select id="gg" data-f="grade" aria-label="Grade level">${gradeOptsList(sc?scopeGrades(sc):GRADES,st.grade)}</select><select id="gs" data-f="section" aria-label="Section">${secs.length?options(secs,st.section):'<option>No sections</option>'}</select><select id="gu" data-f="subject" aria-label="Subject">${options(subs,st.subject)}</select></div>
  ${rows.length?tableHtml([{t:'#'},{t:'Learner'},{t:'Q1',num:1},{t:'Q2',num:1},{t:'Q3',num:1},{t:'Final',num:1},{t:'Remarks'}],rows.map((e,i)=>{
      const g=getG(e.id,st.subject);
      return `<tr data-row="${e.id}"><td>${i+1}</td><td><b>${esc(fullName(S[e.studentId]))}</b></td>${g.map((v,q)=>`<td class="num"><input class="grade-in" inputmode="numeric" maxlength="3" data-q="${q}" data-r="${i}" value="${v==null?'':v}" aria-label="${esc(S[e.studentId].first)} quarter ${q+1}"></td>`).join('')}<td class="num fin"></td><td class="rem"></td></tr>`}),
      `<tfoot><tr><td></td><td>Class average</td><td class="num" data-avg="0"></td><td class="num" data-avg="1"></td><td class="num" data-avg="2"></td><td class="num" data-avg="f"></td><td></td></tr></tfoot>`):emptyHtml('No enrolled learners in this class','Confirm enrollments first, then come back to encode grades.')}</div>`;
  const parse=el=>{const t=el.value.trim();if(t==='')return {v:null,ok:true};if(!/^\d{2,3}$/.test(t))return {v:null,ok:false};const n=Number(t);return {v:n,ok:n>=60&&n<=100}};
  function recalc(){
    const cols=[[],[],[]],fins=[];
    view.querySelectorAll('tr[data-row]').forEach(tr=>{
      const vals=[];
      tr.querySelectorAll('.grade-in').forEach((el,q)=>{const p=parse(el);el.classList.toggle('bad',!p.ok);const v=p.ok?p.v:null;vals.push(v);if(v!=null)cols[q].push(v)});
      const f=finalOf(vals);tr.querySelector('.fin').textContent=f==null?'—':f;tr.querySelector('.fin').classList.toggle('low',f!=null&&f<75);
      tr.querySelector('.rem').innerHTML=pill(remark(f));if(f!=null)fins.push(f);
    });
    view.querySelectorAll('[data-avg]').forEach(td=>{const k=td.dataset.avg;const a=k==='f'?avg(fins):avg(cols[Number(k)]);td.textContent=a==null?'—':a.toFixed(1)});
  }
  if(rows.length)recalc();
  const setDirty=d=>{st.dirty=d;$('#dirty',view).hidden=!d};
  view.oninput=e=>{if(e.target.classList.contains('grade-in')){recalc();setDirty(true)}};
  view.onkeydown=e=>{
    if(e.key==='Enter'&&e.target.classList.contains('grade-in')){e.preventDefault();const nx=view.querySelector(`.grade-in[data-q="${e.target.dataset.q}"][data-r="${Number(e.target.dataset.r)+1}"]`);if(nx){nx.focus();nx.select()}}
  };
  view.onchange=e=>{
    const k=e.target.dataset.f;if(!k)return;
    const apply=()=>{const v=e.target.value;if(k==='grade'){st.grade=Number(v);st.section='';st.subject=''}else st[k]=v;st.dirty=false;MODULES.grades(view)};
    if(st.dirty)confirmBox('Discard unsaved grades?','Changing the class will drop the grades you typed but did not save.','Discard',apply,()=>MODULES.grades(view));else apply();
  };
  view.onclick=e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    if(b.dataset.act==='gsheet'||b.dataset.act==='spoint'){
      if(st.dirty){toast('Save your typed grades first, then open the connection.','err');return}
      openGradesSheets({grade:st.grade,section:st.section,subject:st.subject,rows,onApplied:()=>{st.dirty=false;MODULES.grades(view)}},b.dataset.act==='spoint'?'sharepoint':'google');return;
    }
    if(b.dataset.act!=='save')return;
    const sc2=teacherScope();if(sc2&&!canGrade(sc2,st.grade,st.section,st.subject)){toast('You are not assigned to this subject.','err');return}
    const bad=view.querySelector('.grade-in.bad');if(bad){toast('Grades must be whole numbers from 60 to 100.','err');bad.focus();return}
    view.querySelectorAll('tr[data-row]').forEach(tr=>{
      const eid=tr.dataset.row,vals=[...tr.querySelectorAll('.grade-in')].map(el=>parse(el).v);
      if(vals.every(v=>v==null)){if(db.grades[eid])delete db.grades[eid][st.subject]}
      else{db.grades[eid]=db.grades[eid]||{};db.grades[eid][st.subject]=vals}
    });
    commit(`Saved ${st.subject} grades for Grade ${st.grade} - ${st.section}`);setDirty(false);toast('Grades saved');
  };
};

function reportCardHtml(e,only){
  const S=sMap();
      const s=S[e.studentId],part=!!(only&&only.length),subs=part?only:subjectsFor(e.grade);
      const finals=subs.map(x=>finalOf(getG(e.id,x)));
      const fga=finals.every(v=>v!=null)?avg(finals):null;
      const failing=finals.filter(v=>v!=null&&v<75).length;

      const row=x=>{const g=getG(e.id,x),f=finalOf(g);return `<tr><td>${esc(x)}</td>${g.map(v=>`<td class="num${v!=null&&v<75?' low':''}">${v==null?'—':v}</td>`).join('')}<td class="num${f!=null&&f<75?' low':''}"><b>${f==null?'—':f}</b></td><td>${pill(remark(f))}</td></tr>`};
      const qga=[0,1,2].map(q=>gaFor(e,String(q+1)));
      return `<div class="card flush"><div class="rc-head"><div><h2>${esc(fullName(s))}</h2><small>LRN ${esc(s.lrn)}</small></div><dl><dt>Grade & section</dt><dd>Grade ${e.grade} - ${esc(e.section)}</dd><dt>School year</dt><dd>${SY}</dd><dt>Adviser</dt><dd>${esc(adviserOf(e))}</dd></dl></div>
      ${tableHtml([{t:'Learning area'},{t:'Q1',num:1},{t:'Q2',num:1},{t:'Q3',num:1},{t:'Final',num:1},{t:'Remarks'}],subs.map(row),part?'':`<tfoot><tr><td>General average</td>${qga.map(v=>`<td class="num">${v==null?'—':v.toFixed(2)}</td>`).join('')}<td class="num">${f2(fga)}</td><td></td></tr></tfoot>`)}
      ${part?`<p style="padding:12px 16px;color:var(--muted)">Showing only the subject${subs.length>1?'s':''} assigned to you. The general average and promotion result are for the adviser and the school office.</p>`:`<div class="rc-sum"><div><small>Final general average</small><b>${f2(fga)}</b></div><div><small>Descriptor</small><b style="font-size:16px">${fga==null?'Pending Q3':esc(descriptor(fga))}</b></div><div><small>Result</small><b style="font-size:16px">${pill(status)}</b></div></div>`}</div>`;
}

    return {title:'Grade '+st.grade+' - '+sec+' · '+QLABEL[st.quarter],head,rows,base:'class-record_g'+st.grade+'-'+slug(sec)+'_'+st.quarter,module:'Grades Viewing'};

/* ---------- Reports ---------- */
const REPORTS=[
  {id:'masterlist',name:'Class masterlist',desc:'Learners per grade and section',params:['grade','section']},
  {id:'enrollment',name:'Enrollment summary',desc:'Counts per grade level by sex and status',params:[]},
  {id:'classgrades',name:'Class grade sheet',desc:'Subject grades and general average',params:['grade','section','quarter']},
  {id:'honors',name:'Honor roll',desc:'General average of 90 and above',params:['grade','quarter']},
  {id:'atrisk',name:'Learners below passing',desc:'Subjects graded under 75',params:['grade','quarter']},
  {id:'teachers',name:'Teacher roster',desc:'Faculty list and advisory classes',params:[]}
];
function buildReport(id,p){
  const S=sMap();const gl=p.grade==='all'?GRADES:[Number(p.grade)];
  if(id==='masterlist'){
    const l=enrolledIn(p.grade,p.section);
    return {title:`Class masterlist · Grade ${p.grade}${p.section==='all'?'':' - '+p.section}`,cols:['No.','LRN','Learner','Section','Sex','Birthdate','Age','Parent / guardian','Contact'],rows:l.map((e,i)=>{const s=S[e.studentId];return [i+1,s.lrn,fullName(s),e.section,s.sex,s.birth,age(s.birth),s.guardian||'',s.phone||'']})};
  }
  if(id==='enrollment'){
    const E=curEnr().filter(e=>S[e.studentId]);const rows=GRADES.map(g=>{
      const en=E.filter(e=>e.grade===g&&e.status==='Enrolled');const m=en.filter(e=>S[e.studentId].sex==='M').length,f=en.length-m;
      return [`Grade ${g}`,m,f,en.length,E.filter(e=>e.grade===g&&e.status==='Pending').length,E.filter(e=>e.grade===g&&(e.status==='Dropped'||e.status==='Transferred out')).length]});
    const tot=[ 'Total',...[1,2,3,4,5].map(i=>rows.reduce((a,r)=>a+r[i],0))];
    return {title:`Enrollment summary · SY ${SY}`,cols:['Grade level','Male','Female','Enrolled','Pending','Dropped / transferred'],rows:rows.concat([tot])};
  }
  if(id==='classgrades'){
    const subs=subjectsFor(p.grade),l=enrolledIn(p.grade,p.section);
    return {title:`Class grade sheet · Grade ${p.grade}${p.section==='all'?'':' - '+p.section} · ${QLABEL[p.quarter]}`,cols:['No.','Learner'].concat(subs).concat(['General average','Remarks']),
      rows:l.map((e,i)=>{const ga=gaFor(e,p.quarter);return [i+1,fullName(S[e.studentId])].concat(subs.map(x=>{const v=gradeFor(e,x,p.quarter);return v==null?'':v})).concat([ga==null?'':ga.toFixed(2),ga==null?'Incomplete':(subs.some(x=>gradeFor(e,x,p.quarter)<75)?'Has failing grade':'Passed')])})};
  }
  if(id==='honors'){
    const rows=[];
    gl.forEach(g=>{
      const l=enrolledIn(g,'all').map(e=>({e,ga:gaFor(e,p.quarter)})).filter(d=>d.ga!=null&&d.ga>=90).sort((a,b)=>b.ga-a.ga);
      l.forEach((d,i)=>rows.push([`Grade ${g}`,i+1,fullName(S[d.e.studentId]),d.e.section,d.ga.toFixed(2),d.ga>=98?'With Highest Honors':d.ga>=95?'With High Honors':'With Honors']));
    });
    return {title:`Honor roll · ${p.grade==='all'?'All grades':'Grade '+p.grade} · ${QLABEL[p.quarter]}`,cols:['Grade level','Rank','Learner','Section','General average','Honors'],rows};
  }
  if(id==='atrisk'){
    const rows=[];
    gl.forEach(g=>enrolledIn(g,'all').forEach(e=>{
      const bad=subjectsFor(g).map(x=>({x,v:gradeFor(e,x,p.quarter)})).filter(d=>d.v!=null&&d.v<75);
      if(bad.length)rows.push([`Grade ${g}`,e.section,fullName(S[e.studentId]),bad.length,bad.map(d=>d.x+' ('+d.v+')').join('; ')]);
    }));
    return {title:`Learners below passing · ${p.grade==='all'?'All grades':'Grade '+p.grade} · ${QLABEL[p.quarter]}`,cols:['Grade level','Section','Learner','Subjects below 75','Details'],rows};
  }
  return {title:'Teacher roster',cols:['Emp. no.','Teacher','Department','Position','Advisory','Email','Contact','Status'],rows:db.teachers.slice().sort(byName).map(t=>[t.empNo,fullName(t),t.dept,t.position,t.advisory||'',t.email||'',t.phone||'',t.status])};
}
const csvCell=v=>{const s=String(v==null?'':v);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
MODULES.reports=function(view){
  const st=ui.reports;

};

MODULES.messages=function(view){
  const u=getUser(),S=sMap(),st=ui.msg,isT=u.role==='Teacher',roleLabel=isT?'Adviser':u.role;
  const mine=()=>db.messages.filter(t=>isT?(u.teacherId&&t.teacherId===u.teacherId):(u.studentId&&t.studentId===u.studentId));
  const lastT=t=>t.messages[t.messages.length-1].t;

  const tName=id=>{const t=db.teachers.find(x=>x.id===id);return t?t.first+' '+t.last:'Adviser'};

  function draw(){

    view.innerHTML=pageHead('Messages',isT?'Conversations with the families of your advisory class':'Message your adviser about your learner',`<button class="btn primary" data-act="new">${ICON.plus} New message</button>`)+
    `<div class="split"><div class="card flush">${list.length?`<div class="picklist">${list.map(t=>`<button data-pick="${t.id}" class="${t.id===st.id?'on':''}"><b>${isUnread(t)?'<span class="dot" title="Unread"></span>':''}${esc(t.subject)}</b><small>${esc(who(t))} · ${esc(fmtDate(lastT(t)))}</small></button>`).join('')}</div>`:emptyHtml('No messages yet','Use New message to start a conversation.')}</div><div id="conv">${cur?convHtml(cur):''}</div></div>`;
    const th=$('#thread',view);if(th)th.scrollTop=th.scrollHeight;
  }
  function send(studentId,teacherId,v){
    const now=Date.now();
    const th={id:uid('m'),studentId,teacherId,subject:v.subject,reads:{[u.id]:now},messages:[{id:uid('x'),authorId:u.id,authorName:u.name,role:roleLabel,body:v.text,t:now}]};
    db.messages.push(th);st.id=th.id;persist();toast('Message sent');draw();
  }
  function compose(){
    const subject={key:'subject',label:'Subject',required:true,full:true},text={key:'text',label:'Message',type:'textarea',required:true,full:true};
    if(isT){
      const t=db.teachers.find(x=>x.id===u.teacherId);

      const parts=t.advisory.split('-'),g=parts.shift(),kids=enrolledIn(g,parts.join('-'));
      if(!kids.length)return toast('No enrolled learners in your advisory class yet.','err');
      openForm({title:'New message',fields:[{key:'studentId',label:'Learner (the message goes to their family)',type:'select',full:true,options:kids.map(e=>({v:e.studentId,l:fullName(S[e.studentId])}))},subject,text],onSave:v=>{send(v.studentId,t.id,v)}});
    }else{
      if(!u.studentId||!S[u.studentId])return toast('This account is not linked to a learner.','err');
      const t=adviserFor(u.studentId);

    }

  view.onclick=e=>{

    if(!t)return;
    if(!txt){toast('Write a message first.','err');ta.focus();return}
    t.messages.push({id:uid('x'),authorId:u.id,authorName:u.name,role:roleLabel,body:txt,t:Date.now()});
    t.reads=t.reads||{};t.reads[u.id]=Date.now();persist();toast('Message sent');draw();
  };
  draw();
};

/* ---------- Shared: school name, saving files, CSV ---------- */
const SCHOOL='GEBPSOICS';
const dateISO=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'file';
async function saveFile(name,text,mime,label){
  let d=null;
  try{if(window.claude&&window.claude.use)d=await window.claude.use('downloads')}catch(e){d=null}
  if(d){
    try{await d.save({filename:name,data:text});toast('Saved '+name);return true}
    catch(e){
      if(e&&e.code==='declined'){toast('Download cancelled');return false}
      toast('Saving a file is not available here. Use Copy instead.','err');return false;
    }
  }
  try{
    const b=new Blob([text],{type:mime+';charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Download requested: '+name);return true;
  }catch(e){copyText(text,label||name);return false}

function parseCSV(text,delim){
  const D=delim||',';
  const rows=[];let row=[],cur='',q=false;
  text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===D){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}

function makeHistory(){
  const r=rng(99),out=[],S=sMap();
  db.enrollments.filter(e=>e.sy===SY&&e.status==='Enrolled'&&S[e.studentId]).forEach((e,i)=>{
    if(i%9===4)return;
    const pg=e.grade-1;if(pg<1)return;
    const elem=pg<=6,ab=78+r()*14;
    subjectsFor(pg).forEach(sub=>{
      const q=[0,1,2].map(()=>Math.max(68,Math.min(99,Math.round(ab+(r()-.5)*10))));
      out.push({id:uid('h'),studentId:e.studentId,sy:'2025-2026',grade:pg,section:elem?'':e.section,school:elem?'Sample Elementary School':SCHOOL,schoolId:'',subject:sub,q,final:Math.round(q.reduce((a,b)=>a+b,0)/3)});
    });
  });
  return out;
}
function sf10Years(studentId,includeCurrent){
  if(includeCurrent===undefined)includeCurrent=true;
  const map=new Map();
  (db.sf10||[]).filter(r=>r.studentId===studentId).forEach(r=>{
    const k=r.sy+'|'+r.grade;
    if(!map.has(k))map.set(k,{sy:r.sy,grade:Number(r.grade),section:r.section||'',school:r.school||'',schoolId:r.schoolId||'',source:'history',subjects:[]});
    map.get(k).subjects.push({n:r.subject,q:r.q.slice(0,3),final:r.final!=null?r.final:finalOf(r.q)});
  });
  const e=includeCurrent?curEnr().find(x=>x.studentId===studentId&&x.status==='Enrolled'):null;
  if(e){
    const subs=subjectsFor(e.grade).map(n=>{const q=getG(e.id,n).slice(0,3);return {n,q,final:finalOf(q)}}).filter(x=>x.q.some(v=>v!=null));
    if(subs.length)map.set(SY+'|'+e.grade,{sy:SY,grade:e.grade,section:e.section,school:SCHOOL,schoolId:'',source:'current',subjects:subs});
  }
  const list=[...map.values()].sort((a,b)=>a.sy.localeCompare(b.sy)||a.grade-b.grade);
  list.forEach(y=>{
    const fs=y.subjects.map(x=>x.final);
    y.avg=fs.length&&fs.every(v=>v!=null)?avg(fs):null;
    y.result=y.avg==null?'Incomplete':(fs.every(v=>v>=75)?'Promoted':'Retained');
  });
  return list;
}

function sf10Validate(text){
  const t=(text||'').trim();
  if(!t)return {fatal:'Add a file or paste some data first.'};
  let rows=[];
  if(t[0]==='{'||t[0]==='['){
    try{
      const j=JSON.parse(t),arr=Array.isArray(j)?j:j.rows;if(!Array.isArray(arr))throw new Error('x');
      rows=arr.map((x,i)=>({line:i+1,lrn:String(x.lrn||'').trim(),sy:String(x.sy||x.schoolYear||'').trim(),grade:String(x.grade==null?'':x.grade).trim(),section:String(x.section||''),school:String(x.school||''),schoolId:String(x.schoolId||''),subject:String(x.subject||'').trim(),q:[0,1,2].map(k=>x.q&&x.q[k]!=null?String(x.q[k]):''),final:x.final==null?'':String(x.final)}));
    }catch(e){return {fatal:'This is not valid JSON. Use a file exported from this portal.'}}
  }else{
    const t2=parseCSV(t);
    if(t2.length<2)return {fatal:'The file needs a header row and at least one data row.'};
    const hdr=t2[0].map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,''));
    const col=(...n)=>{for(const k of n){const i=hdr.indexOf(k);if(i>=0)return i}return -1};
    const c={lrn:col('lrn'),sy:col('schoolyear','sy'),grade:col('gradelevel','grade'),section:col('section'),school:col('school','schoolname'),schoolId:col('schoolid'),subject:col('learningarea','subject'),q1:col('q1','1stquarter'),q2:col('q2','2ndquarter'),q3:col('q3','3rdquarter'),final:col('final','finalrating','finalgrade')};
    const names={lrn:'LRN',sy:'School Year',grade:'Grade Level',subject:'Learning Area'};
    const miss=Object.keys(names).filter(k=>c[k]<0);
    if(miss.length)return {fatal:'Missing column: '+miss.map(k=>names[k]).join(', ')+'.'};
    const g=(r,i)=>i<0?'':(r[i]||'').trim();
    rows=t2.slice(1).map((r,i)=>({line:i+2,lrn:g(r,c.lrn),sy:g(r,c.sy),grade:g(r,c.grade),section:g(r,c.section),school:g(r,c.school),schoolId:g(r,c.schoolId),subject:g(r,c.subject),q:[g(r,c.q1),g(r,c.q2),g(r,c.q3)],final:g(r,c.final)}));
  }
  const byLrn=Object.fromEntries(db.students.map(s=>[s.lrn,s]));
  const num=v=>{const s=String(v==null?'':v).trim();if(s==='')return {v:null,ok:true};if(!/^\d{2,3}$/.test(s))return {v:null,ok:false};const n=Number(s);return {v:n,ok:n>=60&&n<=100}};
  const ok=[],errors=[],seen=new Set(),learners=new Set();
  rows.forEach(r=>{
    const err=[],s=byLrn[r.lrn];
    if(!r.lrn)err.push('LRN is blank');else if(!s)err.push('LRN '+r.lrn+' is not in Students');
    const m=/^(\d{4})-(\d{4})$/.exec(r.sy);
    if(!m||Number(m[2])!==Number(m[1])+1)err.push('School year must look like 2024-2025');
    else if(r.sy===SY)err.push('School year '+SY+' is kept in the live records. Import earlier years only');
    const gr=/^\d{1,2}$/.test(r.grade)?Number(r.grade):0;
    if(gr<1||gr>12)err.push('Grade level must be 1 to 12');
    if(!r.subject)err.push('Learning area is blank');
    const qs=r.q.map(num),fin=num(r.final);
    if(qs.some(x=>!x.ok)||!fin.ok)err.push('Grades must be whole numbers from 60 to 100');
    else if(qs.every(x=>x.v==null)&&fin.v==null)err.push('No grades given');
    if(!err.length){
      const key=s.id+'|'+r.sy+'|'+gr+'|'+r.subject.toLowerCase();
      if(seen.has(key))err.push('Duplicate of an earlier row for the same learner, year, grade and learning area');else seen.add(key);
    }
    if(err.length){errors.push({line:r.line,msg:err.join('; ')});return}
    const q=qs.map(x=>x.v);
    ok.push({studentId:s.id,sy:r.sy,grade:gr,section:r.section,school:r.school,schoolId:r.schoolId,subject:r.subject,q,final:fin.v!=null?fin.v:(q.every(v=>v!=null)?Math.round(q.reduce((a,b)=>a+b,0)/3):null)});
    learners.add(s.id);
  });
  return {ok,errors,total:rows.length,learners:learners.size};
}

MODULES.audit=function(view){

  const filtered=()=>{const q=st.q.toLowerCase();return all.filter(a=>(!st.module||a.module===st.module)&&(!st.action||a.action===st.action)&&(!st.user||a.who===st.user)&&(!st.from||dateISO(a.t)>=st.from)&&(!st.to||dateISO(a.t)<=st.to)&&(!q||(a.detail+' '+a.who).toLowerCase().includes(q)))};

    else if(b.dataset.act==='next'){st.page++;list()}

    }
  };
};

   return {title:'Certificate of Enrollment',meta:[['School',SCHOOL]],cols:['Certification'],rows:[[`This is to certify that ${s.first} ${s.middle?s.middle.charAt(0)+'. ':''}${s.last} (LRN ${s.lrn}) is officially enrolled in Grade ${e.grade} - ${e.section} at ${SCHOOL} for school year ${SY}.`],[`Issued on ${new Date().toLocaleDateString('en-PH',{dateStyle:'long'})} upon request for whatever legal purpose it may serve.`]],sign:['School Head']}}}
];
function docCsv(d){
  const out=[[d.title],[SCHOOL]].concat(d.meta.map(m=>[m[0],m[1]]),[[]],[d.cols],d.rows);
  if(d.foot)out.push(d.foot);
  if(d.sign){out.push([]);out.push(d.sign.map(s=>'_______________________'));out.push(d.sign)}
  out.push([],['Generated from the '+SCHOOL+' portal on '+todayISO()+'. Check against the latest DepEd template before submitting.']);
  return '﻿'+toCSV(out);
}
function docHtml(d){
  const cell=(c,t)=>`<${t}>${esc(c)}</${t}>`;
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${esc(d.title)}</title><style>body{font:12px/1.4 Arial,Helvetica,sans-serif;color:#000;margin:24px}h1{font-size:17px;margin:0;text-align:center}h2{font-size:13px;font-weight:normal;text-align:center;margin:2px 0 14px}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px 24px;margin-bottom:12px}.meta span{color:#444}table{border-collapse:collapse;width:100%}th,td{border:1px solid #000;padding:3px 6px;text-align:left;vertical-align:top}th{background:#eee}tfoot td{font-weight:bold}.sign{display:flex;gap:48px;margin-top:44px}.sign div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}.note{margin-top:22px;color:#555;font-size:10px}@page{size:landscape;margin:12mm}</style></head><body><h1>${esc(d.title)}</h1><h2>${esc(SCHOOL)}</h2><div class="meta">${d.meta.map(m=>`<div><span>${esc(m[0])}:</span> <b>${esc(m[1])}</b></div>`).join('')}</div><table><thead><tr>${d.cols.map(c=>cell(c,'th')).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map(c=>cell(c,'td')).join('')}</tr>`).join('')}</tbody>${d.foot?`<tfoot><tr>${d.foot.map(c=>cell(c,'td')).join('')}</tr></tfoot>`:''}</table>${d.sign?`<div class="sign">${d.sign.map(s=>`<div>${esc(s)}</div>`).join('')}</div>`:''}<p class="note">Generated from the ${esc(SCHOOL)} portal on ${todayISO()}. Check against the latest DepEd template before submitting.</p></body></html>`;
}
MODULES.forms=function(view){
  const st=ui.forms,S=sMap();
  view.innerHTML=pageHead('Forms','DepEd school forms filled from your portal records')+
  `<div class="banner"><p>These are DepEd-style layouts generated from portal data, not the official template files. Fields the portal does not record, such as daily attendance and health data, stay blank for you to complete. Check each form against the latest DepEd issuance before you submit it.</p></div>
  <div class="reports"><div class="rlist" id="fl">${FORMS.map(f=>`<button data-f="${f.id}" class="${f.id===st.id?'on':''}"><b>${esc(f.code)} · ${esc(f.name)}</b><small>${esc(f.fill)}</small></button>`).join('')}</div><div class="card flush" id="fp"></div></div>`;
  function paramsHtml(def){
    if(def.param==='class'){
      const secs=['all'].concat(sectionsFor(st.grade));if(!secs.includes(st.section))st.section=secs[1]||'all';
      return `<label>Grade level<select data-p="grade">${gradeOpts(st.grade)}</select></label><label>Section<select data-p="section">${secs.map(s=>`<option value="${esc(s)}"${s===st.section?' selected':''}>${s==='all'?'All sections':esc(s)}</option>`).join('')}</select></label>`;
    }
    if(def.param==='learner'||def.param==='student'){
      const list=def.param==='learner'?curEnr().filter(e=>e.status==='Enrolled'&&S[e.studentId]).map(e=>S[e.studentId]):db.students.slice();
      list.sort(byName);
      if(!list.some(s=>s.id===st.studentId))st.studentId=list[0]?list[0].id:'';
      return `<label>Learner<select data-p="studentId">${list.map(s=>{const e=learnerEnr(s.id);return `<option value="${s.id}"${s.id===st.studentId?' selected':''}>${esc(fullName(s))}${e?' · G'+e.grade+'-'+esc(e.section):''}</option>`}).join('')}</select></label>`;
    }
    return '';
  }
  const docFor=def=>def.build({grade:st.grade,section:st.section,studentId:st.studentId});
  const slugFor=def=>def.param==='class'?'grade'+st.grade+'-'+st.section:(def.param==='none'?'school':(S[st.studentId]?S[st.studentId].last:'learner'));
  function draw(){
    const def=FORMS.find(f=>f.id===st.id)||FORMS[0],ph=paramsHtml(def),d=docFor(def);
    $('#fp',view).innerHTML=`<div class="rhead"><div><h2>${esc(def.name)}</h2><small>${esc(def.desc)}</small></div></div>
    <div class="params">${ph}<span class="grow quick"><button class="btn primary" data-act="csv"${d.rows.length?'':' disabled'}>Download CSV</button><button class="btn" data-act="html"${d.rows.length?'':' disabled'}>Download printable HTML</button><button class="btn" data-act="copy"${d.rows.length?'':' disabled'}>Copy CSV</button></span></div>
    ${d.rows.length?`<div style="padding:12px 16px">${d.meta.length?`<dl class="kv" style="margin:0 0 8px">${d.meta.map(m=>`<dt>${esc(m[0])}</dt><dd>${m[1]===''||m[1]==null?'—':esc(m[1])}</dd>`).join('')}</dl>`:''}</div>
    ${tableHtml(d.cols.map(c=>({t:esc(c)})),d.rows.slice(0,60).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`),d.foot?`<tfoot><tr>${d.foot.map(c=>`<td>${esc(c)}</td>`).join('')}</tr></tfoot>`:'')}
    <div class="pager"><span>${d.rows.length} row${d.rows.length===1?'':'s'}${d.rows.length>60?' · preview shows the first 60, the file has all':''}</span><span>Open the HTML file in a browser to print it or save it as PDF.</span></div>`:emptyHtml('Nothing to show yet',def.param==='class'?'No enrolled learners in this class.':'Pick a learner who is enrolled this school year, or add records first.')}`;
  }
  draw();
  view.onclick=async e=>{
    const f=e.target.closest('[data-f]');
    if(f){st.id=f.dataset.f;view.querySelectorAll('#fl button').forEach(x=>x.classList.toggle('on',x===f));draw();return}
    const b=e.target.closest('[data-act]');if(!b)return;
    const def=FORMS.find(x=>x.id===st.id)||FORMS[0],d=docFor(def),base=slug(def.code+'-'+slugFor(def))+'_'+todayISO();
    if(b.dataset.act==='copy')return copyText(docCsv(d).replace(/^﻿/,''),def.code+' CSV');
    const html=b.dataset.act==='html';
    if(await saveFile(base+(html?'.html':'.csv'),html?docHtml(d):docCsv(d),html?'text/html':'text/csv',def.code))commit('Exported form '+def.code+' ('+slugFor(def)+')','Export','Forms');
  };
  view.onchange=e=>{
    const k=e.target.dataset.p;if(!k)return;
    if(k==='grade'){st.grade=Number(e.target.value);st.section=''}else st[k]=e.target.value;draw();
  };
};

  }
  function recordsPane(){

    pane.innerHTML=`<div class="split"><div class="card flush"><div class="toolbar"><input type="search" id="rq" placeholder="Search name or LRN" value="${esc(st.q)}" aria-label="Search learners"></div><div class="picklist" id="picks"></div></div><div id="rc"></div></div>`;
    const picks=()=>{const q=st.q.toLowerCase(),l=all.filter(s=>!q||(s.lrn+' '+fullName(s)).toLowerCase().includes(q)).slice(0,50);$('#picks',pane).innerHTML=l.length?l.map(s=>`<button data-pick="${s.id}" class="${s.id===st.studentId?'on':''}"><b>${esc(fullName(s))}</b><small>LRN ${esc(s.lrn)} · ${sf10Years(s.id).length} year(s) on record</small></button>`).join(''):emptyHtml('No match')};
    const card=()=>{const s=S[st.studentId];$('#rc',pane).innerHTML=s?`<div class="card flush" style="margin-bottom:12px"><div class="rc-head"><div><h2>${esc(fullName(s))}</h2><small>LRN ${esc(s.lrn)} · ${s.sex==='M'?'Male':'Female'} · born ${esc(s.birth)}</small></div><div class="quick"><button class="btn sm" data-act="one-csv">CSV</button><button class="btn sm" data-act="one-json">JSON</button><button class="btn sm" data-act="one-html">Printable HTML</button></div></div></div>${filesHtml(s.id)}${yearsHtml(s.id)}`:`<div class="card">${emptyHtml('No learners yet','Add students first.')}</div>`};
    picks();card();
  }
  function importPane(){
    const r=imp.res;
    pane.innerHTML=`<div class="two"><section class="card"><h2>1. Prepare the file</h2><p style="color:var(--muted);margin-bottom:10px">One row per learning area. Columns: LRN, School Year, Grade Level, Section, School, School ID, Learning Area, Q1, Q2, Q3, Final. Grades are whole numbers from 60 to 100. A JSON file exported from this portal also works.</p><p style="color:var(--muted);margin-bottom:12px">Each LRN must already be in Students. Importing a year and grade that already has records replaces those records. The current school year (${SY}) is kept in the live records and cannot be imported.</p><div class="quick"><button class="btn" data-act="tpl">Download CSV template</button></div></section>
    <section class="card"><h2>2. Add the data</h2><label class="fld" for="impfile"><span>Choose a CSV or JSON file</span><input type="file" id="impfile" accept=".csv,.json,.txt"></label><label class="fld" for="imptext" style="margin-top:10px"><span>Or paste it here</span><textarea class="csv" id="imptext" placeholder="LRN,School Year,Grade Level,...">${esc(imp.text)}</textarea></label><div class="actions"><button class="btn primary" data-act="check">Check data</button></div></section></div>
    ${r?(r.fatal?`<div class="banner"><p>${esc(r.fatal)}</p></div>`:`<div class="tiles"><div class="tile"><span>Rows ready</span><b>${r.ok.length}</b><small>of ${r.total} rows</small></div><div class="tile"><span>Learners</span><b>${r.learners}</b></div><div class="tile"><span>Problems</span><b>${r.errors.length}</b><small>${r.errors.length?'These rows are skipped':'No problems found'}</small></div></div>
    ${r.errors.length?`<div class="card flush"><div class="rhead"><h2>Rows with problems</h2><small>${r.errors.length>50?'Showing the first 50':r.errors.length+' row'+(r.errors.length===1?'':'s')}</small></div>${tableHtml([{t:'Row'},{t:'Problem'}],r.errors.slice(0,50).map(x=>`<tr><td>${x.line}</td><td>${esc(x.msg)}</td></tr>`))}</div>`:''}
    <div class="actions" style="margin-top:0"><button class="btn primary" data-act="doimport"${r.ok.length?'':' disabled'}>Import ${r.ok.length} row${r.ok.length===1?'':'s'}</button></div>`):''}`;
  }
  function exportPane(){
    const learners=sorted(),scope=ex.scope;
    if(!ex.studentId||!S[ex.studentId])ex.studentId=learners[0]?learners[0].id:'';
    pane.innerHTML=`<div class="card"><h2>Export SF10 records</h2><div class="fgrid">
      <label class="fld" for="xs"><span>Who</span><select id="xs" data-x="scope"><option value="learner"${scope==='learner'?' selected':''}>One learner</option><option value="grade"${scope==='grade'?' selected':''}>Learners now in a grade level</option><option value="all"${scope==='all'?' selected':''}>All learners</option></select></label>
      ${scope==='learner'?`<label class="fld" for="xl"><span>Learner</span><select id="xl" data-x="studentId">${learners.map(s=>`<option value="${s.id}"${s.id===ex.studentId?' selected':''}>${esc(fullName(s))} · ${esc(s.lrn)}</option>`).join('')}</select></label>`:scope==='grade'?`<label class="fld" for="xg"><span>Grade level</span><select id="xg" data-x="grade">${gradeOpts(ex.grade)}</select></label>`:'<span></span>'}
      <label class="fld" for="xf"><span>Format</span><select id="xf" data-x="fmt"><option value="csv"${ex.fmt==='csv'?' selected':''}>CSV (opens in Excel)</option><option value="json"${ex.fmt==='json'?' selected':''}>JSON (for another copy of this portal)</option></select></label>
      <label class="chk" for="xc" style="align-self:end"><input type="checkbox" id="xc" data-x="cur"${ex.cur?' checked':''}> Include school year ${SY}</label></div>

    const rows=exportRows();
